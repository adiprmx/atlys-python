[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlys"
version = "0.1.0"
description = "Python SDK for the Atlys API — 100,000 Indonesian public-data endpoints"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "adiprmx" }]
keywords = ["atlys", "api", "sdk", "indonesia", "osint", "data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/adiprmx/atlys-python"
Documentation = "https://docs.atlys.my.id"
API = "https://api.atlys.my.id"

[tool.setuptools.packages.find]
include = ["atlys*"]
